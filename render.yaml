services:
  - type: web
    name: utme26-ai-backend
    runtime: docker
    plan: free
    envVars:
      # Required — app raises EnvironmentError on startup without this.
      # OpenRouter is now the PRIMARY provider (walks its free model chain
      # in gpt2_test.py) before falling back to Groq/Cerebras.
      - key: OPENROUTER_API_KEY
        sync: false

      # Optional fallback — only reached if every OpenRouter free model
      # fails or is rate-limited.
      - key: GROQ_API_KEY
        sync: false

      # NEW — backend chat memory. Point this at a Postgres instance
      # (same as the Zindryx backend's DATABASE_URL) for real persistence.
      # If omitted, falls back to a local SQLite file — fine for testing,
      # but that file won't survive a redeploy on Render's free plan.
      - key: DATABASE_URL
        sync: false

      # NEW — durable memory backup. Every chat turn is dual-written here
      # (users/{userid}/messages/{auto_id}) so that when Render redeploys
      # and wipes Postgres/SQLite, build_memory() can recover the user's
      # history from Firestore instead of starting them over from scratch.
      # Use the same Firebase project/service account as the working
      # Zindryx app if you want, or a separate one — either works.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

      # Optional fallback providers — app runs fine without these, just
      # skips straight past them in the provider chain if unset
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Optional search fallbacks — ddgs is tried first, these are only
      # used if ddgs fails
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # NEW — image search fallback chain (Google CSE -> SerpAPI -> ddgs)
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

      # NEW — card tools. Every one is optional: a PAID provider is used only when its key is set, and each
      # tool has a FREE fallback (so leaving these blank loses nothing but quality).
      - key: GOOGLE_PLACES_API_KEY   # search_places: Google Places first; else Photon/Nominatim (OpenStreetMap)
        sync: false
      - key: API_FOOTBALL_KEY        # get_sports: API-Football for soccer first; else ESPN public feed
        sync: false
      - key: AP_ELECTIONS_API_KEY    # get_election_results: AP feed first (US); else labelled web search
        sync: false
      # NEW — MCP connected apps. MCP_TOKEN_KEY is REQUIRED to save any app token (no key => tokens refused).
      # Generate one:  python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: MCP_TOKEN_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS       # optional comma list, e.g. mcp.notion.com,mcp.slack.com — recommended in production
        sync: false
      - key: PUBLIC_BASE_URL         # optional; share links use it (falls back to Render's RENDER_EXTERNAL_URL)
        sync: false

      # NEW — premium image-generation provider chain (gpt2_functions.py:
      # _build_image_provider_chain). Every one of these is optional and
      # independent: whichever keys are actually set here become the
      # premium (isPremium=true) chain, in this priority order —
      # Flux -> Stability -> Ideogram -> Recraft — with Ideogram jumping
      # to the front only when a prompt asks for legible text in the
      # image. Leave any of these blank and that provider is just skipped,
      # nothing breaks. Free-tier accounts never touch these keys at all —
      # they always use Pollinations (no key needed, already wired).
      - key: BFL_API_KEY        # Black Forest Labs — Flux Pro
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: IDEOGRAM_API_KEY
        sync: false
      - key: RECRAFT_API_KEY
        sync: false

      # NEW — lightweight Gemini streaming service (see lite_stream.py).
      # LITE_STREAM_URL: https://zindryx-ai-backend.onrender.com/stream  (unset = feature off)
      # SERVICE_API_KEY: same random secret as on the Gemini service.
      - key: LITE_STREAM_URL
        sync: false
      - key: SERVICE_API_KEY
        sync: false
